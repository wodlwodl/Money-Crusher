<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460">
  <defs>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8c779"/>
      <stop offset="1" stop-color="#bb713f"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c77c48"/>
      <stop offset="1" stop-color="#884a35"/>
    </linearGradient>
    <style>
      .hammer-swing {
        transform-box: fill-box;
        transform-origin: 82% 86%;
        animation: swing .52s ease-in-out infinite alternate;
      }
      .player-bob { animation: player-bob .8s ease-in-out infinite alternate; }
      @keyframes swing { to { transform: rotate(25deg); } }
      @keyframes player-bob { to { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) {
        .hammer-swing, .player-bob { animation: none; }
      }
    </style>
  </defs>

