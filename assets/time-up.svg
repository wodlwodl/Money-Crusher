    <style>
      .slipper { transform-box: fill-box; transform-origin: 0% 50%; animation: swat .42s ease-in-out infinite alternate; }
      .stars { transform-box: fill-box; transform-origin: center; animation: dizzy .8s ease-in-out infinite alternate; }
      @keyframes swat { to { transform: rotate(12deg) translateX(8px); } }
      @keyframes dizzy { to { transform: rotate(12deg) scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .slipper, .stars { animation: none; } }
    </style>
