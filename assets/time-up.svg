<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <defs>
    <linearGradient id="gameOverSign" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffabbc"/>
      <stop offset="1" stop-color="#ef6682"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#faf5e8"/>
      <stop offset="1" stop-color="#ded0ba"/>
    </linearGradient>
    <style>
      .rage { animation: rage .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .dizzy { animation: dizzy .8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes rage { to { transform: translateY(-4px) rotate(4deg); } }
      @keyframes dizzy { to { transform: rotate(12deg) scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .rage, .dizzy { animation: none; } }
    </style>
  </defs>

  <rect x="3" y="3" width="994" height="494" rx="8" fill="#fff" stroke="#d7c6f4" stroke-width="6"/>

