<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="pigBody" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffb5c5"/>
      <stop offset="1" stop-color="#ee668a"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9f08a"/>
      <stop offset="1" stop-color="#55b978"/>
    </linearGradient>
    <style>
      .rain { transform-box: fill-box; transform-origin: center; animation: fall 4s linear infinite; }
      .rain.slow { animation-duration: 5.2s; }
      .rain.fast { animation-duration: 3.4s; }
      .pig-runner { transform-box: fill-box; transform-origin: center; animation: bounce .42s ease-in-out infinite alternate; }
      .leg-a { transform-box: fill-box; transform-origin: top center; animation: run .28s ease-in-out infinite alternate; }
      .leg-b { transform-box: fill-box; transform-origin: top center; animation: run .28s ease-in-out infinite alternate-reverse; }
      .chase { transform-box: fill-box; transform-origin: center bottom; animation: chase .5s ease-in-out infinite alternate; }
      .dust { transform-box: fill-box; transform-origin: center; animation: puff .9s ease-out infinite; }
      @keyframes fall {
        0% { opacity: 0; translate: 0 -100px; rotate: -18deg; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { opacity: 0; translate: 0 480px; rotate: 28deg; }
      }
      @keyframes bounce { to { transform: translateY(-9px) rotate(-2deg); } }
      @keyframes run { to { transform: rotate(28deg); } }
      @keyframes chase { to { transform: translate(-6px, -7px) rotate(-2deg); } }
      @keyframes puff { 0% { opacity: 0; transform: translateX(0) scale(.5); } 35% { opacity: .8; } 100% { opacity: 0; transform: translateX(-24px) scale(1.5); } }
      @media (prefers-reduced-motion: reduce) {
        .rain, .pig-runner, .leg-a, .leg-b, .chase, .dust { animation: none; }
      }
    </style>
  </defs>

