<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="cash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5f49b"/>
      <stop offset="1" stop-color="#62bd7b"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff19b"/>
      <stop offset="1" stop-color="#e99a21"/>
    </linearGradient>
    <style>
      .counting-bill { transform-box: fill-box; transform-origin: center; animation: count .65s ease-in-out infinite alternate; }
      .coin-sparkle { animation: sparkle .8s ease-in-out infinite alternate; }
      @keyframes count { to { transform: translateY(-12px) rotate(9deg); } }
      @keyframes sparkle { to { opacity: .35; transform: scale(.8); } }
      @media (prefers-reduced-motion: reduce) { .counting-bill, .coin-sparkle { animation: none; } }
    </style>
  </defs>

  <ellipse cx="500" cy="324" rx="290" ry="17" fill="#180b31" opacity=".23"/>
  <g stroke="#97581f" stroke-width="5">
    <ellipse cx="328" cy="291" rx="42" ry="17" fill="url(#coin)"/>
    <path d="M286 278v13c0 10 19 18 42 18s42-8 42-18v-13" fill="#df9429"/>
    <ellipse cx="328" cy="278" rx="42" ry="17" fill="url(#coin)"/>
    <ellipse cx="673" cy="292" rx="47" ry="18" fill="url(#coin)"/>
    <path d="M626 278v14c0 10 21 18 47 18s47-8 47-18v-14" fill="#df9429"/>
    <ellipse cx="673" cy="278" rx="47" ry="18" fill="url(#coin)"/>
  </g>
  <g fill="#e99a21" stroke="#97581f" stroke-width="5">
    <circle cx="414" cy="303" r="20"/><circle cx="585" cy="305" r="22"/>
    <circle cx="377" cy="320" r="15"/><circle cx="625" cy="321" r="15"/>
  </g>
  <g fill="none" stroke="#fff1a7" stroke-width="4" stroke-linecap="round">
    <path d="M414 293v20m-7-10h14m166 2v20m-7-10h14m-211 15v12m-5-6h10m251-7v12m-5-6h10"/>
  </g>

  <g transform="rotate(-8 315 245)">
    <rect x="241" y="215" width="151" height="48" rx="7" fill="url(#cash)" stroke="#326e50" stroke-width="6"/>
    <rect x="250" y="222" width="133" height="34" rx="4" fill="none" stroke="#e5ffc5" stroke-width="3"/>
    <circle cx="317" cy="239" r="13" fill="#eaffbd" stroke="#43865a" stroke-width="3"/>
    <text x="317" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="900" fill="#39724e">$</text>
  </g>
  <g transform="rotate(7 690 245)">
    <rect x="614" y="211" width="151" height="49" rx="7" fill="url(#cash)" stroke="#326e50" stroke-width="6"/>
    <rect x="623" y="218" width="133" height="35" rx="4" fill="none" stroke="#e5ffc5" stroke-width="3"/>
    <circle cx="690" cy="236" r="13" fill="#eaffbd" stroke="#43865a" stroke-width="3"/>
    <text x="690" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="900" fill="#39724e">$</text>
  </g>

  <g stroke="#17131b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="503" cy="76" r="35" stroke-width="15"/>
    <path d="M495 113q-24 47-34 105"/>
    <path d="m486 145-63 25-42-26m84 10 68 20 48-27"/>
    <path d="m461 218-62 33-43 1m106-1 48 32 52 2"/>
    <path d="m356 252-21 17m227 16 24 11" stroke-width="11"/>
    <circle cx="381" cy="144" r="8" fill="#17131b" stroke="none"/>
    <circle cx="596" cy="153" r="8" fill="#17131b" stroke="none"/>
  </g>
  <g class="counting-bill">
    <rect x="340" y="103" width="87" height="48" rx="6" fill="url(#cash)" stroke="#326e50" stroke-width="6"/>
    <rect x="347" y="109" width="73" height="36" rx="4" fill="none" stroke="#e5ffc5" stroke-width="3"/>
    <circle cx="383" cy="127" r="11" fill="#eaffbd" stroke="#43865a" stroke-width="3"/>
    <text x="383" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#39724e">$</text>
  </g>
  <g transform="rotate(10 622 119)">
    <rect x="584" y="94" width="83" height="47" rx="6" fill="url(#cash)" stroke="#326e50" stroke-width="6"/>
    <rect x="591" y="100" width="69" height="35" rx="4" fill="none" stroke="#e5ffc5" stroke-width="3"/>
    <circle cx="625" cy="118" r="10" fill="#eaffbd" stroke="#43865a" stroke-width="3"/>
    <text x="625" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="900" fill="#39724e">$</text>
  </g>

  <g class="coin-sparkle" fill="#ffd84d">
    <path d="m244 109 6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="m753 74 5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
    <path d="m705 177 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
  </g>
</svg>
